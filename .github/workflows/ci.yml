name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [ '1.23.x', '1.24.x' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Go version
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck (Linux only, Go 1.24+)
        if: runner.os == 'Linux' && (matrix.go == '1.24.x')
        run: |
          # Install staticcheck using the same Go version as the matrix
          go install honnef.co/go/tools/cmd/staticcheck@latest
          # Verify staticcheck works with current Go version
          staticcheck -version

      - name: Run staticcheck (Linux only, Go 1.24+)
        if: runner.os == 'Linux' && (matrix.go == '1.24.x')
        run: staticcheck -checks "all,-SA1019,-ST1003" ./...

      - name: Test (race on Linux)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            go test ./... -race -coverprofile=coverage.out 2>&1 | grep -v "deprecated" || TEST_EXIT=${PIPESTATUS[0]}
          else
            go test ./... -coverprofile=coverage.out 2>&1 | grep -v "deprecated" || TEST_EXIT=${PIPESTATUS[0]}
          fi
          # Ensure coverage.out exists even if tests don't generate it
          touch coverage.out || true
          # Exit with test exit code if tests failed
          exit ${TEST_EXIT:-0}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: coverage.out
